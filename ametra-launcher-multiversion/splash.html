<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>RzClient</title>
<style>
*{margin:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 40%,#1a0f2e 0%,#07050c 60%,#040305 100%);color:#f3f3f3;font-family:'Segoe UI',system-ui,sans-serif;-webkit-app-region:drag;user-select:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;position:relative;border:1px solid #2a1f3d}
.halo{position:absolute;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(168,85,247,.35),transparent 65%);animation:breathe 3s ease-in-out infinite;pointer-events:none}
.logo{position:relative;width:250px;height:auto;filter:drop-shadow(0 0 22px rgba(168,85,247,.55));animation:in .8s cubic-bezier(.2,1.2,.4,1) both}
.ver{position:relative;font-size:11px;letter-spacing:.2em;color:#8e7fa8;text-transform:uppercase;animation:fade .6s .3s both}
.bar{position:relative;width:240px;height:3px;background:#1d1530;border-radius:3px;overflow:hidden;animation:fade .6s .4s both}
.bar i{position:absolute;top:0;bottom:0;width:45%;background:linear-gradient(90deg,#7c3aed,#c084fc,#7c3aed);border-radius:3px;animation:slide 1.4s ease-in-out infinite}
.status{position:relative;font-size:12px;color:#8e7fa8;min-height:16px;transition:opacity .2s;animation:fade .6s .5s both}
.dots{position:absolute;inset:0;pointer-events:none}
.dots i{position:absolute;width:3px;height:3px;border-radius:50%;background:#c084fc;opacity:0;animation:rise 4s linear infinite}
@keyframes in{from{opacity:0;transform:scale(.85) translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes breathe{50%{transform:scale(1.12);opacity:.75}}
@keyframes slide{0%{left:-45%}100%{left:100%}}
@keyframes rise{0%{transform:translateY(30px);opacity:0}20%{opacity:.7}100%{transform:translateY(-230px);opacity:0}}
</style></head><body>
<div class="halo"></div>
<div class="dots" id="dots"></div>
<img class="logo" src="assets/splash-logo.png" alt="RzClient">
<div class="ver" id="ver">Versión 1.3.0</div>
<div class="bar"><i></i></div>
<div class="status" id="status">Preparando launcher…</div>
<script>
// Partículas suaves de fondo
const box = document.getElementById('dots');
for (let i = 0; i < 16; i++) {
  const d = document.createElement('i');
  d.style.left = Math.random() * 100 + '%';
  d.style.bottom = Math.random() * 25 + '%';
  d.style.animationDelay = (Math.random() * 4) + 's';
  d.style.animationDuration = (3 + Math.random() * 3) + 's';
  box.appendChild(d);
}
// Versión que llega desde main.js (?v=...)
const v = new URLSearchParams(location.search).get('v');
if (v) document.getElementById('ver').textContent = 'Versión ' + v;
// main.js llama a setStatus(...) para mostrar en qué va
function setStatus(t) {
  const el = document.getElementById('status');
  el.style.opacity = 0;
  setTimeout(() => { el.textContent = t; el.style.opacity = 1; }, 150);
}
</script>
</body></html>
